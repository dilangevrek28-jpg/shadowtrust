[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shadowtrust"
version = "0.1.0"
description = "Explainable banking account takeover detection and adaptive trust engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
]

[project.scripts]
shadowtrust-api = "shadowtrust.cli:run"
shadowtrust-evaluate = "shadowtrust.evaluation.cli:run"

[dependency-groups]
dev = [
    "httpx2>=2.0.0b1,<3",
    "pytest>=9.0.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shadowtrust"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
