global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: shadowtrust-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
    http_headers:
      X-Metrics-API-Key:
        files:
          - /run/secrets/shadowtrust_prometheus_api_key
